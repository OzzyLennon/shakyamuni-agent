<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>释迦牟尼佛 Agent</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 米色禅意书卷风：取自 logo 的米色背景 + 金色笔触 */
            --bg-page: #f0e8d6;          /* 主背景：米色（比 logo 略深） */
            --bg-card: #faf4e2;          /* 卡片背景：浅米（更亮） */
            --bg-input: #ffffff;          /* 输入区：纯白（高对比） */
            --bg-user: #f0e1bf;          /* 用户消息：暖金米 */
            --bg-buddha: #ffffff;         /* 佛陀回答：纯白 */
            --text-primary: #2a2520;     /* 主文字：暗棕 */
            --text-secondary: #6b5e4a;   /* 次文字：暖灰棕 */
            --text-muted: #9a8d75;       /* 弱化文字 */
            --accent: #b08847;            /* 主金色（logo 笔触色） */
            --accent-light: #d4a574;     /* 亮金（hover / highlight） */
            --accent-glow: rgba(176, 136, 71, 0.12);
            --border: #d9cdb6;            /* 浅米边 */
            --border-hover: #b08847;      /* hover 边（金色） */
            --shadow: 0 4px 24px rgba(120, 90, 40, 0.08);
            --shadow-hover: 0 6px 32px rgba(120, 90, 40, 0.14);
            --radius: 16px;
            --radius-lg: 24px;
        }

        body {
            /* 用 logo 的米色作背景，加上淡淡的禅意纸纹理 */
            background:
                radial-gradient(ellipse 60% 50% at 50% 0%, rgba(255, 245, 220, 0.5), transparent 70%),
                radial-gradient(ellipse 80% 60% at 80% 100%, rgba(212, 165, 116, 0.06), transparent),
                var(--bg-page);
            background-attachment: fixed;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100dvh;
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(212, 165, 116, 0.06), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(212, 165, 116, 0.04), transparent);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        header {
            padding: 60px 0 40px;
            text-align: center;
        }

        .logo-mark {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: block;
            box-shadow:
                0 0 0 1px var(--border),
                0 8px 32px rgba(176, 136, 71, 0.15),
                0 0 80px var(--accent-glow);
            object-fit: cover;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .logo-mark:hover {
            transform: scale(1.04) rotate(-2deg);
            box-shadow:
                0 0 0 1px var(--accent),
                0 12px 40px rgba(176, 136, 71, 0.25),
                0 0 120px var(--accent-glow);
        }

        header h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.9rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            font-style: italic;
        }

        .chat-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        .chat-messages {
            padding: 32px;
            min-height: 400px;
            max-height: 55vh;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--accent-light);
            border-radius: 3px;
        }

        .message {
            margin-bottom: 28px;
            opacity: 0;
            transform: translateY(16px);
            animation: messageIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .message:last-child {
            margin-bottom: 0;
        }

        @keyframes messageIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            text-align: right;
        }

        .message-content {
            display: inline-block;
            max-width: 85%;
            padding: 16px 20px;
            border-radius: var(--radius);
            line-height: 1.8;
            font-size: 0.95rem;
            text-align: left;
            box-shadow: 0 1px 2px rgba(120, 90, 40, 0.06);
        }

        .message.user .message-content {
            background: linear-gradient(135deg, var(--bg-user) 0%, #ead8b0 100%);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .message.buddha .message-content {
            background: var(--bg-buddha);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
        }

        .message-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 0.8rem;
        }

        .message.user .message-label {
            justify-content: flex-end;
        }

        .model-tag {
            background: linear-gradient(135deg, var(--accent-glow), rgba(176, 136, 71, 0.05));
            color: var(--accent);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid rgba(176, 136, 71, 0.3);
            letter-spacing: 0.1em;
        }

        /* 佛经面板 - 页面底部独立 */
        .sources-panel {
            max-width: 900px;
            margin: 0 auto 16px;
            padding: 0 24px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: none;
        }

        .sources-panel.visible {
            display: block;
        }

        .sources-panel-header {
            padding: 14px 20px;
            background: var(--bg-card);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
            transition: background 0.2s;
        }

        .sources-panel-header:hover {
            background: var(--bg-input);
        }

        .sources-panel-header h4 {
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 600;
            margin: 0;
        }

        .sources-panel-header .toggle-icon {
            color: var(--text-muted);
            font-size: 0.7rem;
            transition: transform 0.2s;
        }

        .sources-panel-header.expanded .toggle-icon {
            transform: rotate(90deg);
        }

        .sources-list-wrapper {
            max-height: 0;
            overflow: hidden;
            background: var(--bg-card);
            transition: max-height 0.3s ease;
        }

        .sources-list-wrapper.expanded {
            max-height: 400px;
            overflow-y: auto;
        }

        .sources-list {
            padding: 0 20px 16px;
        }

        .source-item {
            background: var(--bg-input);
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            border: 1px solid var(--border);
            transition: border-color 0.2s;
        }

        .source-item:last-child {
            margin-bottom: 0;
        }

        .source-item:hover {
            border-color: var(--border-hover);
        }

        .source-header {
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .source-title {
            color: var(--accent);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .source-title .expand-icon {
            font-size: 0.6rem;
            color: var(--text-muted);
            transition: transform 0.2s;
        }

        .source-item.expanded .source-title .expand-icon {
            transform: rotate(90deg);
        }

        .source-content {
            display: none;
            padding: 0 16px 12px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .source-item.expanded .source-content {
            display: block;
        }

        /* 联网搜索面板 - 页面底部独立 */
        .web-panel {
            max-width: 900px;
            margin: 0 auto 16px;
            padding: 0 24px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: none;
        }

        .web-panel.visible {
            display: block;
        }

        .web-panel-header {
            padding: 14px 20px;
            background: var(--bg-card);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .web-panel-header:hover {
            background: var(--bg-input);
        }

        .web-panel-header h4 {
            color: #64b4ff;
            font-size: 0.85rem;
            font-weight: 600;
            margin: 0;
        }

        .web-panel-header .toggle-icon {
            color: var(--text-muted);
            font-size: 0.7rem;
            transition: transform 0.2s;
        }

        .web-panel-header.expanded .toggle-icon {
            transform: rotate(90deg);
        }

        .web-list-wrapper {
            max-height: 0;
            overflow: hidden;
            background: var(--bg-card);
            transition: max-height 0.3s ease;
        }

        .web-list-wrapper.expanded {
            max-height: 300px;
            overflow-y: auto;
        }

        .web-list {
            padding: 0 20px 16px;
        }

        .web-item {
            background: var(--bg-input);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            border: 1px solid var(--border);
        }

        .web-item:last-child {
            margin-bottom: 0;
        }

        blockquote {
            border-left: 3px solid var(--accent);
            padding: 10px 18px;
            margin: 14px 0;
            background: linear-gradient(90deg, var(--accent-glow), transparent 60%);
            border-radius: 0 8px 8px 0;
            color: var(--text-primary);
            font-style: italic;
        }

        .web-title {
            color: #64b4ff;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .web-snippet {
            color: var(--text-secondary);
            font-size: 0.8rem;
            line-height: 1.5;
        }

        /* 输入区 */
        .input-area {
            padding: 20px 24px;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        #question-input {
            width: 100%;
            min-height: 48px;
            max-height: 200px;
            padding: 14px 20px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            line-height: 1.5;
            resize: none;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-shadow: inset 0 1px 2px rgba(120, 90, 40, 0.04);
        }

        #question-input::placeholder {
            color: var(--text-muted);
            font-style: italic;
        }

        #question-input:focus {
            border-color: var(--accent);
            box-shadow:
                0 0 0 3px var(--accent-glow),
                inset 0 1px 2px rgba(120, 90, 40, 0.04);
        }

        #submit-btn {
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            color: #fff8e7;
            border: none;
            border-radius: var(--radius);
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        #submit-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(176, 136, 71, 0.3);
        }

        #submit-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        #submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing-indicator {
            padding: 16px 20px;
            display: none;
        }

        .typing-indicator.visible {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        footer {
            text-align: center;
            padding: 32px 24px;
            color: var(--text-muted);
            font-size: 0.78rem;
            letter-spacing: 0.15em;
        }
        footer::before, footer::after {
            content: '·';
            margin: 0 12px;
            color: var(--accent);
        }

        /* 历史面板 */
        .history-panel {
            position: fixed;
            right: -320px;
            top: 0;
            width: 320px;
            height: 100dvh;
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            z-index: 1000;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .history-panel.open {
            right: 0;
        }

        /* Panel 打开时自动隐藏 ☰ 按钮（避免被 panel 覆盖） */
        .history-panel.open ~ .history-toggle-btn {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
        }
        .history-toggle-btn {
            transition: opacity 0.25s, transform 0.25s;
        }

        .history-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .history-header h3 {
            font-size: 1rem;
            font-weight: 600;
        }

        .history-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px;
        }

        .history-close:hover {
            color: var(--text-primary);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .history-item {
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            background: var(--bg-page);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s, transform 0.15s;
        }

        .history-item:hover {
            border-color: var(--accent);
            background: var(--accent-glow);
            transform: translateX(-2px);
        }

        .history-question {
            font-size: 0.85rem;
            color: var(--text-primary);
            margin-bottom: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-time {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .history-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .history-toggle-btn {
            position: fixed;
            right: 16px;
            bottom: 100px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 999;
        }

        .history-toggle-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 24px rgba(0,0,0,0.4);
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .container {
                padding: 0 16px;
            }

            header {
                padding: 40px 0 24px;
            }

            header h1 {
                font-size: 1.5rem;
            }

            .chat-messages {
                padding: 20px;
                max-height: 45vh;
            }

            .message-content {
                max-width: 92%;
                padding: 12px 16px;
                font-size: 0.9rem;
            }

            .input-area {
                padding: 16px;
                flex-direction: column;
            }

            #submit-btn {
                width: 100%;
                padding: 14px;
            }

            .sources-panel,
            .web-panel {
                margin: 0 16px 12px;
                padding: 0 16px;
            }

            .history-panel {
                width: 280px;
            }

            .history-toggle-btn {
                right: 12px;
                bottom: 80px;
            }
        }

        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
        .chat-container { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both; }
        .input-area { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }

        /* === Markdown 渲染样式（answer 区域） === */
        .message-content h1,
        .message-content h2,
        .message-content h3,
        .message-content h4 {
            font-family: 'Noto Serif SC', serif;
            color: var(--text-primary);
            margin: 20px 0 12px;
            line-height: 1.4;
            font-weight: 600;
        }
        .message-content h1 { font-size: 1.3rem; }
        .message-content h2 { font-size: 1.15rem; color: var(--accent); }
        .message-content h3 { font-size: 1.05rem; color: var(--accent); }
        .message-content h4 { font-size: 0.95rem; color: var(--text-secondary); }
        .message-content p { margin: 10px 0; }
        .message-content ul,
        .message-content ol {
            margin: 10px 0 10px 24px;
            padding-left: 8px;
        }
        .message-content li { margin: 4px 0; }
        .message-content code {
            background: rgba(212, 165, 116, 0.1);
            border: 1px solid rgba(212, 165, 116, 0.2);
            border-radius: 4px;
            padding: 1px 6px;
            font-family: 'JetBrains Mono', Consolas, monospace;
            font-size: 0.85em;
            color: var(--accent);
        }
        .message-content pre {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            overflow-x: auto;
            margin: 12px 0;
        }
        .message-content pre code {
            background: none;
            border: none;
            padding: 0;
            color: var(--text-primary);
        }
        .message-content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 20px 0;
        }
        .message-content a {
            color: var(--accent);
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        /* === 消息操作按钮（复制 / 重新生成） === */
        .message-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .message.buddha:hover .message-actions,
        .message.buddha.streaming .message-actions {
            opacity: 1;
        }
        .message-actions button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 10px;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
            font-family: inherit;
        }
        .message-actions button:hover {
            color: var(--accent);
            border-color: var(--accent);
            background: rgba(212, 165, 116, 0.08);
        }
        .message-actions button.copied {
            color: #4ade80;
            border-color: #4ade80;
        }
        .message.streaming {
            opacity: 1;
        }
        .message.streaming .message-content::after {
            content: '▊';
            display: inline-block;
            color: var(--accent);
            animation: cursorBlink 1s steps(1) infinite;
            margin-left: 2px;
        }
        @keyframes cursorBlink {
            50% { opacity: 0; }
        }

        /* === 快捷问句 chips === */
        .quick-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 14px 24px 18px;
            background: var(--bg-card);
            border-top: 1px dashed var(--border);
        }
        .quick-chips .chip {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 14px;
            font-size: 0.82rem;
            border-radius: 16px;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s, background 0.15s, transform 0.15s;
            font-family: inherit;
        }
        .quick-chips .chip:hover {
            color: var(--accent);
            border-color: var(--accent);
            background: var(--accent-glow);
            transform: translateY(-1px);
        }
        .quick-chips .chip:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        /* === 字体切换器 === */
        .font-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 4px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 4px;
            box-shadow: var(--shadow);
            z-index: 50;
            transition: right 0.3s ease;
        }
        /* 历史问答 panel 打开时，字体切换器左移避开 panel */
        body:has(.history-panel.open) .font-switcher {
            right: 360px;
        }
        .font-switcher button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 4px 12px;
            font-size: 0.78rem;
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            font-family: inherit;
        }
        .font-switcher button.active {
            background: var(--accent);
            color: #fff8e7;
        }
        .font-switcher button:hover:not(.active) {
            color: var(--accent);
            background: var(--accent-glow);
        }

        /* 字体主题（由 JS 切 .font-xxx 类） */
        body.font-song  { --font-heading: 'Noto Serif SC', serif; }
        body.font-kai  { --font-heading: 'Ma Shan Zheng', 'Noto Serif SC', serif; }
        body.font-zen  { --font-heading: 'Ma Shan Zheng', 'Noto Serif SC', serif; }

        /* 标题 + 强调元素接字体变量 */
        header h1 { font-family: var(--font-heading, 'Noto Serif SC', serif); }
        body.font-kai .message-content h1,
        body.font-kai .message-content h2,
        body.font-kai .message-content h3,
        body.font-kai .message-content h4,
        body.font-kai .message-content blockquote,
        body.font-kai .message-content strong,
        body.font-zen .message-content h1,
        body.font-zen .message-content h2,
        body.font-zen .message-content h3,
        body.font-zen .message-content h4,
        body.font-zen .message-content blockquote,
        body.font-zen .message-content strong {
            font-family: var(--font-heading);
        }

        /* "禅"模式：加大字距 + 行高 */
        body.font-zen .message.buddha .message-content { letter-spacing: 0.05em; line-height: 2.0; }
        body.font-zen .message-content blockquote { letter-spacing: 0.12em; }
        body.font-zen header h1 { font-size: 2.2rem; letter-spacing: 0.2em; }
    </style>
</head>
<body class="font-song">
    <div class="font-switcher" id="font-switcher">
        <button data-font="song" class="active">宋</button>
        <button data-font="kai">楷</button>
        <button data-font="zen">禅</button>
    </div>
    <div class="container">
        <header>
            <img class="logo-mark" src="{{ url_for('static', filename='agent_logo.png') }}" alt="释迦牟尼佛">
            <h1>释迦牟尼佛</h1>
            <p>·  以佛陀教法，与你论生死解脱  ·</p>
        </header>

        <div class="chat-container">
            <div class="chat-messages" id="chat-messages">
                <div class="message buddha">
                    <div class="message-label">
                        <span class="model-tag">如来</span>
                    </div>
                    <div class="message-content">
                        <p>阿弥陀佛。善男子/善女人，汝今来问，缘也。有什么关于佛法的问题，尽管来问。</p>
                    </div>
                </div>
            </div>

            <div class="typing-indicator" id="typing-indicator">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="question-input" placeholder="输入你的问题... (Shift+Enter 换行，Enter 发送)" rows="1" autocomplete="off"></textarea>
                </div>
                <button id="submit-btn">提问</button>
            </div>

            <!-- 快捷问句 chips -->
            <div class="quick-chips" id="quick-chips">
                <button class="chip" data-q="什么是空？">什么是空？</button>
                <button class="chip" data-q="何为禅？">何为禅？</button>
                <button class="chip" data-q="佛是什么？">佛是什么？</button>
                <button class="chip" data-q="什么是无常？">什么是无常？</button>
                <button class="chip" data-q="阿弥陀佛是谁？">阿弥陀佛是谁？</button>
            </div>
        </div>

        <!-- 佛经原文出处 - 页面底部 -->
        <div class="sources-panel" id="sources-panel">
            <div class="sources-panel-header" id="sources-header">
                <h4>📜 佛经原文出处</h4>
                <span class="toggle-icon">▶</span>
            </div>
            <div class="sources-list-wrapper" id="sources-wrapper">
                <div class="sources-list" id="sources-list"></div>
            </div>
        </div>

        <!-- 联网补充 - 页面底部 -->
        <div class="web-panel" id="web-panel">
            <div class="web-panel-header" id="web-header">
                <h4>🌐 联网补充</h4>
                <span class="toggle-icon">▶</span>
            </div>
            <div class="web-list-wrapper" id="web-wrapper">
                <div class="web-list" id="web-list"></div>
            </div>
        </div>

        <footer>
            释迦牟尼佛 · 佛经检索 + 人格蒸馏
        </footer>

        <!-- 历史面板 -->
        <div class="history-panel" id="history-panel">
            <div class="history-header">
                <h3>历史问答</h3>
                <div style="display:flex;gap:8px;">
                    <button class="history-close" id="history-close">×</button>
                </div>
            </div>
            <div style="padding:12px;border-bottom:1px solid var(--border);">
                <button id="new-chat-btn" style="width:100%;padding:10px;border-radius:10px;background:var(--accent);color:var(--bg-dark);border:none;cursor:pointer;font-weight:600;">开启新对话</button>
            </div>
            <div class="history-list" id="history-list">
                <div class="history-empty">暂无历史记录</div>
            </div>
        </div>

        <!-- 历史面板开关 -->
        <button class="history-toggle-btn" id="history-toggle" title="历史记录">☰</button>
    </div>

    <script>
        // API 配置 - 部署时修改为你的服务器地址
        const API_BASE_URL = '';

        const chatMessages = document.getElementById('chat-messages');
        const questionInput = document.getElementById('question-input');
        const submitBtn = document.getElementById('submit-btn');
        const sourcesPanel = document.getElementById('sources-panel');
        const sourcesList = document.getElementById('sources-list');
        const sourcesHeader = document.getElementById('sources-header');
        const sourcesWrapper = document.getElementById('sources-wrapper');
        const webPanel = document.getElementById('web-panel');
        const webList = document.getElementById('web-list');
        const webHeader = document.getElementById('web-header');
        const webWrapper = document.getElementById('web-wrapper');
        const typingIndicator = document.getElementById('typing-indicator');
        const historyPanel = document.getElementById('history-panel');
        const historyList = document.getElementById('history-list');
        const historyToggle = document.getElementById('history-toggle');
        const historyClose = document.getElementById('history-close');
        const newChatBtn = document.getElementById('new-chat-btn');

        let isLoading = false;
        let messageCount = 0;
        let currentSession = [];
        let chatHistory = JSON.parse(localStorage.getItem('buddha_sessions') || '[]');
        let activeHistoryIdx = -1;

        function formatTime(date) {
            const h = date.getHours().toString().padStart(2, '0');
            const m = date.getMinutes().toString().padStart(2, '0');
            return `${h}:${m}`;
        }

        function saveHistory() {
            localStorage.setItem('buddha_sessions', JSON.stringify(chatHistory));
        }

        function renderHistory() {
            if (chatHistory.length === 0) {
                historyList.innerHTML = '<div class="history-empty">暂无历史记录</div>';
                return;
            }
            historyList.innerHTML = chatHistory.map((session, idx) => `
                <div class="history-item" data-idx="${idx}">
                    <div class="history-question">${session.title}</div>
                    <div class="history-time">${session.time}</div>
                </div>
            `).join('');

            document.querySelectorAll('.history-item').forEach(item => {
                item.addEventListener('click', () => {
                    restoreSession(parseInt(item.dataset.idx));
                });
            });
        }

        function restoreSession(idx) {
            const session = chatHistory[idx];
            if (!session) return;

            chatMessages.innerHTML = '';
            currentSession = [];
            messageCount = 0;

            session.messages.forEach(msg => {
                addMessage(msg.role, msg.content);
            });

            activeHistoryIdx = idx;
            sourcesPanel.classList.remove('visible');
            webPanel.classList.remove('visible');
            historyPanel.classList.remove('open');
        }

        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            let labelHtml = '';
            if (role === 'buddha') {
                labelHtml = `
                    <div class="message-label">
                        <span class="model-tag">如来</span>
                    </div>
                `;
            }

            // 对用户消息直接转义；佛陀消息走 markdown 渲染
            const contentHtml = role === 'buddha'
                ? renderMarkdown(content)
                : `<p>${escapeHtml(content).replace(/\n/g, '<br>')}</p>`;

            const actionsHtml = role === 'buddha' ? `
                <div class="message-actions">
                    <button class="copy-btn" data-raw="${escapeAttr(content)}" title="复制全文">📋 复制</button>
                    <button class="regen-btn" data-q="${escapeAttr(currentSession.find(m => m.role === 'user')?.content || '')}" title="重新生成">🔄 重新生成</button>
                </div>
            ` : '';

            messageDiv.innerHTML = `
                ${labelHtml}
                <div class="message-content" data-raw="${escapeAttr(content)}">${contentHtml}</div>
                ${actionsHtml}
            `;

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            messageCount++;
            messageDiv.dataset.msgId = messageCount;
            currentSession.push({ role, content });

            // 绑定该消息的操作按钮
            if (role === 'buddha') {
                const copyBtn = messageDiv.querySelector('.copy-btn');
                const regenBtn = messageDiv.querySelector('.regen-btn');
                if (copyBtn) {
                    copyBtn.addEventListener('click', () => copyMessage(copyBtn));
                }
                if (regenBtn) {
                    regenBtn.addEventListener('click', () => {
                        const q = regenBtn.dataset.q;
                        if (q) {
                            // 移除当前佛陀回答
                            currentSession.pop();
                            chatMessages.removeChild(messageDiv);
                            messageCount--;
                            // 删除对应的 sources panel（只清最新一次）
                            sourcesPanel.classList.remove('visible');
                            webPanel.classList.remove('visible');
                            questionInput.value = q;
                            sendQuestion();
                        }
                    });
                }
            }
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }
        function escapeAttr(s) {
            return escapeHtml(s).replace(/"/g, '&quot;');
        }

        // 轻量 markdown 渲染（h1-h4、blockquote、ul/ol、code、pre、hr、**bold**、*em*、`code`）
        // inline=true 时处理 **bold**/*em*/`code`；false 时只渲染 block 元素（流式用）
        function renderMarkdown(text, inline = true) {
            const fmt = inline ? fmtInline : (s => s);
            const lines = text.split('\n');
            let html = '';
            let inList = null;
            let inBlockquote = false;
            let inCode = false;
            let codeBuf = [];
            const flushList = () => { if (inList) { html += `</${inList}>`; inList = null; } };
            const flushBQ = () => { if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; } };
            for (const line of lines) {
                if (line.trim().startsWith('```')) {
                    if (inCode) { html += `<pre><code>${escapeHtml(codeBuf.join('\n'))}</code></pre>`; codeBuf = []; inCode = false; }
                    else { flushList(); flushBQ(); inCode = true; }
                    continue;
                }
                if (inCode) { codeBuf.push(line); continue; }
                const t = line.trim();
                if (!t) { flushList(); flushBQ(); continue; }
                const h = t.match(/^(#{1,4})\s+(.+)$/);
                if (h) { flushList(); flushBQ(); html += `<h${h[1].length}>${fmt(escapeHtml(h[2]))}</h${h[1].length}>`; continue; }
                if (/^-{3,}$/.test(t)) { flushList(); flushBQ(); html += '<hr>'; continue; }
                if (t.startsWith('>')) {
                    flushList();
                    if (!inBlockquote) { html += '<blockquote>'; inBlockquote = true; }
                    html += `<p>${fmt(escapeHtml(t.replace(/^>\s*/, '')))}</p>`;
                    continue;
                } else flushBQ();
                const ul = t.match(/^[-*+]\s+(.+)$/);
                if (ul) { if (inList !== 'ul') { flushList(); html += '<ul>'; inList = 'ul'; } html += `<li>${fmt(escapeHtml(ul[1]))}</li>`; continue; }
                const ol = t.match(/^\d+\.\s+(.+)$/);
                if (ol) { if (inList !== 'ol') { flushList(); html += '<ol>'; inList = 'ol'; } html += `<li>${fmt(escapeHtml(ol[1]))}</li>`; continue; }
                flushList();
                html += `<p>${fmt(escapeHtml(line))}</p>`;
            }
            flushList(); flushBQ();
            if (inCode) html += `<pre><code>${escapeHtml(codeBuf.join('\n'))}</code></pre>`;
            return html;
        }
        function fmtInline(s) {
            return s
                .replace(/`([^`\n]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
                .replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
        }

        async function copyMessage(btn) {
            const raw = btn.dataset.raw;
            try {
                await navigator.clipboard.writeText(raw);
                const orig = btn.textContent;
                btn.textContent = '✓ 已复制';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
            } catch (e) {
                // fallback for old browsers
                const ta = document.createElement('textarea');
                ta.value = raw;
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); } catch (_) {}
                document.body.removeChild(ta);
                btn.textContent = '✓ 已复制';
                setTimeout(() => { btn.textContent = '📋 复制'; }, 1500);
            }
        }

        function showTyping() {
            typingIndicator.classList.add('visible');
            chatMessages.appendChild(typingIndicator);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTyping() {
            typingIndicator.classList.remove('visible');
        }

        function showSources(sources) {
            if (sources && sources.length > 0) {
                sourcesPanel.classList.add('visible');
                // 自动展开佛经面板
                sourcesHeader.classList.add('expanded');
                sourcesWrapper.classList.add('expanded');
                
                sourcesList.innerHTML = sources.map((s, idx) => {
                    // 解析格式：《标题》第X行：内容
                    const match = s.match(/^《(.+?)》第(\d+)行：(.+)$/);
                    if (match) {
                        return `
                            <div class="source-item expanded" data-idx="${idx}">
                                <div class="source-header">
                                    <div class="source-title">
                                        <span class="expand-icon">▼</span>
                                        ${match[1]} 第${match[2]}行
                                    </div>
                                </div>
                                <div class="source-content">${match[3]}</div>
                            </div>
                        `;
                    } else {
                        return `
                            <div class="source-item expanded" data-idx="${idx}">
                                <div class="source-header">
                                    <div class="source-title">
                                        <span class="expand-icon">▼</span>
                                        ${s.substring(0, 50)}${s.length > 50 ? '...' : ''}
                                    </div>
                                </div>
                                <div class="source-content">${s}</div>
                            </div>
                        `;
                    }
                }).join('');

                // 添加点击展开/折叠事件
                document.querySelectorAll('.source-item').forEach(item => {
                    item.querySelector('.source-header').addEventListener('click', () => {
                        item.classList.toggle('expanded');
                        const icon = item.querySelector('.expand-icon');
                        icon.textContent = item.classList.contains('expanded') ? '▼' : '▶';
                    });
                });
            }
        }

        function showWebResults(webResults) {
            if (webResults && webResults.length > 0) {
                webPanel.classList.add('visible');
                webList.innerHTML = webResults.map(w => `
                    <div class="web-item">
                        <div class="web-title">${w.title || ''}</div>
                        <div class="web-snippet">${w.snippet || ''}</div>
                    </div>
                `).join('');
            }
        }

        function stripToneDescriptions(text) {
            // 只去掉括号表情（如果还有），不要动换行/段落（否则 markdown block 全废）
            return text
                .replace(/（[^）]*[微微笑低眉展眉合十垂目]*[^）]*）/g, '')
                .replace(/[ \t]+/g, ' ')  // 只合并行内空格和 tab，保留 \n
                .replace(/[ \t]+\n/g, '\n')  // 去掉行尾空格
                .trim();
        }

        function autoResizeTextarea() {
            questionInput.style.height = 'auto';
            questionInput.style.height = Math.min(questionInput.scrollHeight, 200) + 'px';
        }

        historyToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            historyPanel.classList.toggle('open');
        });

        historyClose.addEventListener('click', () => {
            historyPanel.classList.remove('open');
        });

        // 点 panel 内部不关闭
        historyPanel.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // 点 panel 外部关闭
        document.addEventListener('click', () => {
            if (historyPanel.classList.contains('open')) {
                historyPanel.classList.remove('open');
            }
        });

        // ESC 关闭
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && historyPanel.classList.contains('open')) {
                historyPanel.classList.remove('open');
            }
        });

        newChatBtn.addEventListener('click', () => {
            chatMessages.innerHTML = `
                <div class="message buddha">
                    <div class="message-label">
                        <span class="model-tag">如来</span>
                    </div>
                    <div class="message-content">
                        <p>阿弥陀佛。善男子/善女人，汝今来问，缘也。有什么关于佛法的问题，尽管来问。</p>
                    </div>
                </div>
            `;
            messageCount = 0;
            currentSession = [];
            activeHistoryIdx = -1;
            sourcesPanel.classList.remove('visible');
            webPanel.classList.remove('visible');
            historyPanel.classList.remove('open');
            questionInput.value = '';
            questionInput.focus();
            fetch(`${API_BASE_URL}/api/reset`, { method: 'POST' });
        });

        sourcesHeader.addEventListener('click', () => {
            sourcesHeader.classList.toggle('expanded');
            sourcesWrapper.classList.toggle('expanded');
        });

        webHeader.addEventListener('click', () => {
            webHeader.classList.toggle('expanded');
            webWrapper.classList.toggle('expanded');
        });

        async function sendQuestion() {
            const question = questionInput.value.trim();
            if (!question || isLoading) return;

            isLoading = true;
            submitBtn.disabled = true;
            submitBtn.textContent = '思惟中...';
            questionInput.value = '';
            autoResizeTextarea();
            // chip 在加载时禁用
            document.querySelectorAll('.chip').forEach(c => c.disabled = true);

            addMessage('user', question);
            showTyping();

            sourcesPanel.classList.remove('visible');
            webPanel.classList.remove('visible');

            // 先创建空佛陀消息用于流式 append
            const streamingMsgDiv = document.createElement('div');
            streamingMsgDiv.className = 'message buddha streaming';
            streamingMsgDiv.innerHTML = `
                <div class="message-label">
                    <span class="model-tag">如来</span>
                </div>
                <div class="message-content" data-raw=""></div>
            `;
            chatMessages.appendChild(streamingMsgDiv);
            const streamingContent = streamingMsgDiv.querySelector('.message-content');

            let accumulated = '';
            let finalAnswer = '';
            let finalSutra = [];
            let finalWeb = [];

            try {
                const response = await fetch(`${API_BASE_URL}/api/chat/stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });

                if (!response.ok) {
                    hideTyping();
                    streamingMsgDiv.remove();
                    addMessage('buddha', `错误: HTTP ${response.status}`);
                    return;
                }

                hideTyping();

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    // SSE: 事件以 \n\n 分隔
                    const events = buffer.split('\n\n');
                    buffer = events.pop() || '';
                    for (const ev of events) {
                        const line = ev.trim();
                        if (!line.startsWith('data:')) continue;
                        const payload = line.slice(5).trim();
                        if (payload === '[DONE]') continue;
                        let data;
                        try { data = JSON.parse(payload); } catch (_) { continue; }
                        const type = data.type;
                        if (type === 'sources') {
                            finalSutra = data.data;
                            // 先显示，等流结束再正式渲染到面板（避免半路闪烁）
                        } else if (type === 'web') {
                            finalWeb = data.data;
                        } else if (type === 'chunk') {
                            accumulated += data.data;
                            finalAnswer = accumulated;
                            // 流式渲染：渲染 block 元素（标题/引用/列表/代码块），inline 元素等流结束
                            streamingContent.dataset.raw = accumulated;
                            streamingContent.innerHTML = renderMarkdown(accumulated, false);
                            chatMessages.scrollTop = chatMessages.scrollHeight;
                        } else if (type === 'error') {
                            streamingMsgDiv.remove();
                            addMessage('buddha', `错误: ${data.data}`);
                            return;
                        }
                    }
                }

                // 流结束：渲染 markdown + 加操作按钮
                const cleanAnswer = stripToneDescriptions(finalAnswer);
                streamingContent.dataset.raw = cleanAnswer;
                streamingContent.innerHTML = renderMarkdown(cleanAnswer);
                // 加操作按钮
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'message-actions';
                actionsDiv.innerHTML = `
                    <button class="copy-btn" title="复制全文">📋 复制</button>
                    <button class="regen-btn" title="重新生成">🔄 重新生成</button>
                `;
                streamingMsgDiv.appendChild(actionsDiv);
                streamingMsgDiv.classList.remove('streaming');
                const copyBtn = actionsDiv.querySelector('.copy-btn');
                const regenBtn = actionsDiv.querySelector('.regen-btn');
                copyBtn.addEventListener('click', () => {
                    copyBtn.dataset.raw = cleanAnswer;
                    copyMessage(copyBtn);
                });
                regenBtn.addEventListener('click', () => {
                    currentSession.pop(); // 移除上次佛陀回答
                    streamingMsgDiv.remove();
                    sourcesPanel.classList.remove('visible');
                    webPanel.classList.remove('visible');
                    questionInput.value = question;
                    sendQuestion();
                });

                if (finalSutra.length > 0) showSources(finalSutra);
                if (finalWeb.length > 0) showWebResults(finalWeb);

                // 更新 session：清掉 addMessage user 重复的 user，加这个完整的 buddha
                // 简化：直接 push 完整回答（user 已在 addMessage 加过）
                if (currentSession.length > 0 && currentSession[currentSession.length - 1].role === 'user') {
                    currentSession.push({ role: 'buddha', content: cleanAnswer });
                } else {
                    currentSession.push({ role: 'buddha', content: cleanAnswer });
                }
                saveCurrentSession();
            } catch (error) {
                hideTyping();
                if (streamingMsgDiv.parentNode) streamingMsgDiv.remove();
                addMessage('buddha', `网络错误: ${error.message}`);
            }

            isLoading = false;
            submitBtn.disabled = false;
            submitBtn.textContent = '提问';
            document.querySelectorAll('.chip').forEach(c => c.disabled = false);
            questionInput.focus();
        }

        function saveCurrentSession() {
            if (currentSession.length === 0) return;
            if (activeHistoryIdx >= 0) {
                chatHistory[activeHistoryIdx].messages = [...currentSession];
            } else {
                const firstUserMsg = currentSession.find(m => m.role === 'user');
                const title = firstUserMsg
                    ? firstUserMsg.content.substring(0, 30) + (firstUserMsg.content.length > 30 ? '...' : '')
                    : '新对话';
                chatHistory.unshift({
                    title: title,
                    time: formatTime(new Date()),
                    messages: [...currentSession]
                });
                activeHistoryIdx = 0;
                if (chatHistory.length > 50) chatHistory = chatHistory.slice(0, 50);
            }
            saveHistory();
            renderHistory();
        }

        submitBtn.addEventListener('click', sendQuestion);
        questionInput.addEventListener('keydown', (e) => {
            // Enter 发送，Shift+Enter 换行
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendQuestion();
            } else {
                // 让浏览器默认处理（Shift+Enter 换行）
                setTimeout(autoResizeTextarea, 0);
            }
        });
        questionInput.addEventListener('input', autoResizeTextarea);

        // 快捷问句 chip 点击
        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', () => {
                if (isLoading) return;
                questionInput.value = chip.dataset.q;
                autoResizeTextarea();
                sendQuestion();
            });
        });

        autoResizeTextarea();
        questionInput.focus();
        renderHistory();

        // 字体切换器
        (function initFontSwitcher() {
            const saved = localStorage.getItem('buddha_font') || 'song';
            document.body.classList.remove('font-song', 'font-kai', 'font-zen');
            document.body.classList.add('font-' + saved);
            document.querySelectorAll('.font-switcher button').forEach(b => {
                b.classList.toggle('active', b.dataset.font === saved);
            });
            document.getElementById('font-switcher').addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-font]');
                if (!btn) return;
                const font = btn.dataset.font;
                document.body.classList.remove('font-song', 'font-kai', 'font-zen');
                document.body.classList.add('font-' + font);
                localStorage.setItem('buddha_font', font);
                document.querySelectorAll('.font-switcher button').forEach(b => {
                    b.classList.toggle('active', b.dataset.font === font);
                });
            });
        })();
    </script>
</body>
</html>
